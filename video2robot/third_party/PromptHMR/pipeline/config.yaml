calib: null
focal: null
stride: 1
tracker: sam2
kp2d_detector: vitpose
depth_method: metric3d_vit_large
use_depth: false
max_height: 896
calib_method: ba
hand_pose: false
smooth_cam: true
use_spec_calib: true

det_thresh: 0.1
det_score_thresh: 0.1
det_height_thresh: 0.3
# Group-dance fix: raise NMS OKS so overlapping dancers are not merged as duplicates,
# and pick the keyframe with the most people / most spread formation instead of the
# first detectable frame (which permanently fixes the track count).
nms_oks_thresh: 0.7
keyframe_search: true
keyframe_stride: 10
keyframe_search_frac: 0.03
# Multi-keyframe re-acquisition: re-detect + re-condition dancers who exit and re-enter
# the frame (SAM2 forward-only propagation otherwise loses them permanently).
# Disabled: naive last-position matching mis-associates and regressed coverage (v7);
# SAM3 multiplex (the proper fix) is GPU-memory-blocked on T4. Keep single-keyframe.
reacquire: false
reacq_stride: 50
reacq_iou: 0.3
save_vos: false
save_depth: false

bbox_interp: true
load_images_to_cpu: true
run_post_opt: true
run_post_opt_cam: true
floor_fitting: ransac
fps: 30
postopt_lr: 1e-2
num_max_people: 100
max_fps: 60